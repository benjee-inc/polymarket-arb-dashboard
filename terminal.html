<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Alpha Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#00ff00;font-family:'SF Mono','Consolas','Monaco',monospace;height:100vh;overflow:hidden}
.header{background:#111;padding:8px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;font-size:0.85rem}
.header-left{display:flex;align-items:center;gap:12px}
.pnl-bar{display:flex;gap:20px;align-items:center}
.pnl-item{text-align:center}
.pnl-label{font-size:0.6rem;color:#666;text-transform:uppercase}
.pnl-value{font-size:1.1rem;font-weight:bold}
.pnl-pos{color:#00ff00}.pnl-neg{color:#ff0044}.pnl-neutral{color:#888}
.tab-bar{background:#0d0d0d;padding:0 20px;border-bottom:1px solid #333;display:flex;font-size:0.8rem}
.tab{padding:8px 20px;cursor:pointer;border-right:1px solid #222;color:#888;transition:all 0.2s}
.tab:hover{background:#1a1a1a;color:#00ff00}
.tab.active{background:#00ff00;color:#000;font-weight:bold}
.content{padding:15px 20px;height:calc(100vh - 90px);overflow-y:auto;background:#0a0a0a}
.log-entry{margin-bottom:3px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:0.8rem;padding:2px 0;border-bottom:1px solid #111}
.log-timestamp{color:#555;margin-right:10px}
.log-type-scan{color:#00ff00}.log-type-think{color:#00aaff}.log-type-decision{color:#ffaa00;font-weight:bold}.log-type-trade{color:#ff00ff;font-weight:bold}.log-type-palpha{color:#00ddff;font-weight:bold}.log-type-error{color:#ff0044}.log-type-pipeline{display:none}
.pos-card{background:#111;border:1px solid #222;margin-bottom:6px;padding:10px 14px;border-radius:3px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pos-card.profit{border-left:3px solid #00ff00}.pos-card.loss{border-left:3px solid #ff0044}.pos-card.flat{border-left:3px solid #555}
.pos-q{font-size:0.8rem;color:#ccc;font-weight:bold}
.pos-meta{font-size:0.75rem;color:#888;margin-top:4px;display:flex;flex-wrap:wrap;gap:12px}
.pos-meta span{color:#00ff00}
.pos-pnl{text-align:right;min-width:100px}
.pos-pnl-val{font-size:1.2rem;font-weight:bold}
.pos-pnl-pct{font-size:0.7rem;color:#888}
.pos-thesis{font-size:0.65rem;color:#555;margin-top:4px;font-style:italic;grid-column:1/-1}
.wallet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.w-box{background:#111;border:1px solid #333;padding:12px;text-align:center;border-radius:4px}
.w-label{font-size:0.65rem;color:#666;text-transform:uppercase;margin-bottom:4px}
.w-val{font-size:1.5rem;font-weight:bold;color:#00ff00}
.closed-card{background:#0d0d0d;border:1px solid #222;padding:8px 12px;margin-bottom:4px;font-size:0.75rem;color:#888;border-radius:2px}
.dot{display:inline-block;width:8px;height:8px;background:#00ff00;border-radius:50%;margin-left:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.empty{color:#555;padding:40px;text-align:center}
.source-tag{font-size:0.55rem;padding:1px 5px;border-radius:2px;margin-left:6px;font-weight:normal;vertical-align:middle}
.source-onchain{background:#1a3a1a;color:#00ff00;border:1px solid #00ff0033}
.source-clob{background:#1a1a3a;color:#5588ff;border:1px solid #5588ff33}
.source-api{background:#3a3a1a;color:#ffaa00;border:1px solid #ffaa0033}
.verified{color:#00ff00;font-size:0.7rem;margin-left:8px}
.unverified{color:#ff0044;font-size:0.7rem;margin-left:8px}
.tx-link{color:#5588ff;text-decoration:none;font-size:0.7rem}
.tx-link:hover{text-decoration:underline}
.flow-header{display:flex;gap:2px;margin-bottom:12px;padding:8px 0;border-bottom:1px solid #222;flex-wrap:wrap}
.flow-stat{text-align:center;padding:4px 12px;background:#111;border:1px solid #222;border-radius:3px;min-width:70px}
.flow-stat-val{font-size:1.1rem;font-weight:bold;color:#00ff00}
.flow-stat-label{font-size:0.55rem;color:#555;text-transform:uppercase;letter-spacing:1px}
.flow-stream{display:flex;flex-direction:column;gap:1px}
.flow-row{display:flex;align-items:flex-start;gap:8px;padding:4px 8px;font-size:0.78rem;line-height:1.4;transition:background 0.15s}
.flow-row:hover{filter:brightness(1.3)}
.flow-time{color:#444;font-size:0.7rem;min-width:60px;flex-shrink:0;padding-top:1px}
.flow-icon{font-size:0.7rem;min-width:20px;text-align:center;flex-shrink:0;font-weight:bold;padding-top:1px}
.flow-tag{font-size:0.6rem;padding:1px 6px;border-radius:2px;font-weight:bold;min-width:65px;text-align:center;flex-shrink:0;letter-spacing:0.5px}
.flow-msg{color:#ccc;word-wrap:break-word;flex:1}
.flow-money{color:#00ff00;font-weight:bold}
.flow-pct-pos{color:#00ff00}.flow-pct-neg{color:#ff0044}
.flow-market{color:#ffaa00}
.flow-src{color:#333;font-size:0.6rem;min-width:90px;text-align:right;flex-shrink:0;font-style:italic}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0a0a}::-webkit-scrollbar-thumb{background:#333}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <a href="https://polymarket.com/@dolphyyiiee" target="_blank" rel="noopener" style="color:#888;text-decoration:none">POLYMARKET ALPHA</a>
    <div class="pnl-bar">
      <div class="pnl-item"><div class="pnl-label">Balance</div><div class="pnl-value pnl-neutral" id="hBal">--</div></div>
      <div class="pnl-item"><div class="pnl-label">Deployed</div><div class="pnl-value pnl-neutral" id="hDep">--</div></div>
      <div class="pnl-item"><div class="pnl-label">Unrealized P&L</div><div class="pnl-value" id="hPnl">--</div></div>
      <div class="pnl-item"><div class="pnl-label">Realized P&L</div><div class="pnl-value" id="hReal">--</div></div>
      <div class="pnl-item"><div class="pnl-label">Positions</div><div class="pnl-value pnl-neutral" id="hPos">--</div></div>
    </div>
  </div>
  <div>
    <span id="statusText" style="color:#888;font-size:0.75rem">connecting</span>
    <span id="verifiedAt" class="verified" style="display:none"></span>
    <span class="dot" id="dot"></span>
  </div>
</div>
<div class="tab-bar">
  <div class="tab active" data-tab="logs">LOGS</div>
  <div class="tab" data-tab="positions">OPEN</div>
  <div class="tab" data-tab="closed">CLOSED</div>
  <div class="tab" data-tab="wallet">WALLET</div>
  <div class="tab" data-tab="perf">PERF</div>
  <div class="tab" data-tab="data">DATA</div>
</div>
<div class="content" id="content"></div>

<script>
// ── Constants ────────────────────────────────────────────
const WALLET = '0x28f2912200d589D9d3E969841757BAd08588f1C9';
const DATA_API = 'https://data-api.polymarket.com';
const CLOB_API = 'https://clob.polymarket.com';
const POLYGON_RPC = 'https://polygon-bor-rpc.publicnode.com';
const USDC_CONTRACT = '0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174';
const CTF_CONTRACT = '0x4D97DCd97eC945f40cF65F87097ACe5EA0476045';
const GITHUB_RAW = 'https://raw.githubusercontent.com/benjee-inc/polymarket-arb-dashboard/main';

// ── State ────────────────────────────────────────────────
const content = document.getElementById('content');
let currentTab = 'logs';
let positions = [];          // from Data API /positions
let liveMidpoints = {};      // from CLOB /midpoints
let onChainBalances = {};    // tokenId → on-chain share count
let usdcBalance = null;      // from Polygon RPC
let activity = [];           // from Data API /activity
let cachedLogs = [];         // from GitHub terminal.jsonl
let lastVerifiedAt = null;
let onChainVerified = false;

// ── Live Data Flow State ────────────────────────────────
const GAMMA_API = 'https://gamma-api.polymarket.com';
let dataFlowItems = [];       // unified stream: { ts, tag, color, icon, msg, source }
const DATA_FLOW_MAX = 500;
let prevGammaSnapshot = new Map(); // conditionId → { price, volume24h, change1h }
let lastFlowPollAt = 0;

// ── Helpers ──────────────────────────────────────────────
function fmt(v) { return '$' + parseFloat(v || 0).toFixed(2); }
function ts(d) { return new Date(d).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function pnlClass(v) { return v > 0.001 ? 'pnl-pos' : v < -0.001 ? 'pnl-neg' : 'pnl-neutral'; }

// ── Data: Positions from Data API ────────────────────────
async function fetchPositions() {
  try {
    const res = await fetch(`${DATA_API}/positions?user=${WALLET}`, {
      signal: AbortSignal.timeout(10000)
    });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data)) positions = data;
  } catch (err) {
    console.error('[positions]', err.message);
  }
}

// ── Data: Live Midpoints from CLOB ───────────────────────
async function fetchLivePrices() {
  if (!positions.length) return;
  const tokenIds = positions.map(p => p.asset).filter(Boolean);
  if (!tokenIds.length) return;
  try {
    const res = await fetch(`${CLOB_API}/midpoints`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tokenIds),
      signal: AbortSignal.timeout(5000)
    });
    if (!res.ok) return;
    const data = await res.json();
    // data is { tokenId: midpoint, ... }
    if (data && typeof data === 'object') liveMidpoints = data;
  } catch (err) {
    console.error('[midpoints]', err.message);
  }
}

// ── Data: On-chain verification via Polygon RPC ──────────
function encodeBalanceOf(address) {
  // balanceOf(address) selector = 0x70a08231
  const padded = address.slice(2).toLowerCase().padStart(64, '0');
  return '0x70a08231' + padded;
}

function encodeBalanceOfERC1155(address, tokenId) {
  // balanceOf(address, uint256) selector = 0x00fdd58e
  const padAddr = address.slice(2).toLowerCase().padStart(64, '0');
  // tokenId is a large decimal string — convert to hex padded to 64 chars
  const hexId = BigInt(tokenId).toString(16).padStart(64, '0');
  return '0x00fdd58e' + padAddr + hexId;
}

async function rpcCall(to, data) {
  const res = await fetch(POLYGON_RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', id: 1, method: 'eth_call',
      params: [{ to, data }, 'latest']
    }),
    signal: AbortSignal.timeout(10000)
  });
  const json = await res.json();
  return json.result;
}

async function verifyOnChain() {
  try {
    // Fetch USDC balance
    const usdcResult = await rpcCall(USDC_CONTRACT, encodeBalanceOf(WALLET));
    if (usdcResult) {
      usdcBalance = Number(BigInt(usdcResult)) / 1e6;
    }

    // Verify each position's share count on-chain
    const newBalances = {};
    for (const p of positions) {
      if (!p.asset) continue;
      try {
        const result = await rpcCall(CTF_CONTRACT, encodeBalanceOfERC1155(WALLET, p.asset));
        if (result) {
          // CTF tokens have 6 decimals (conditional tokens)
          newBalances[p.asset] = Number(BigInt(result)) / 1e6;
        }
      } catch { /* individual token failure is ok */ }
    }
    onChainBalances = newBalances;
    lastVerifiedAt = new Date();

    // Check if on-chain matches API
    let allMatch = true;
    for (const p of positions) {
      if (!p.asset || onChainBalances[p.asset] === undefined) continue;
      const apiSize = parseFloat(p.size || 0);
      const chainSize = onChainBalances[p.asset];
      if (Math.abs(apiSize - chainSize) > 0.01) {
        allMatch = false;
        break;
      }
    }
    onChainVerified = allMatch;
  } catch (err) {
    console.error('[on-chain]', err.message);
  }
}

// ── Data: Trade Activity from Data API ───────────────────
async function fetchActivity() {
  try {
    const res = await fetch(`${DATA_API}/activity?user=${WALLET}&limit=50`, {
      signal: AbortSignal.timeout(10000)
    });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data)) activity = data;
  } catch (err) {
    console.error('[activity]', err.message);
  }
}

// ── Data: Scanner Logs from GitHub ───────────────────────
async function fetchLogs() {
  try {
    const res = await fetch(GITHUB_RAW + '/logs/terminal.jsonl?t=' + Date.now(), {
      signal: AbortSignal.timeout(10000)
    });
    if (!res.ok) return;
    const text = await res.text();
    cachedLogs = text.trim().split('\n').filter(l => l).map(l => {
      try { return JSON.parse(l); } catch { return null; }
    }).filter(Boolean);
  } catch (err) {
    console.error('[logs]', err.message);
  }
}

// ── Live Data Flow: Pull from same APIs as AI scanner ────
function pushFlow(tag, color, icon, msg, source) {
  dataFlowItems.unshift({ ts: new Date().toISOString(), tag, color, icon, msg, source });
  if (dataFlowItems.length > DATA_FLOW_MAX) dataFlowItems.length = DATA_FLOW_MAX;
}

// 1. Live global trade feed — big money flowing in real time
async function pollLiveTrades() {
  try {
    const res = await fetch(`${DATA_API}/trades?limit=25&filterType=CASH&filterAmount=500`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) return;
    const trades = await res.json();
    if (!Array.isArray(trades)) return;

    // Only show trades newer than last poll
    for (const t of trades.slice(0, 15)) {
      const tradeTs = (t.timestamp || 0) * 1000;
      if (tradeTs <= lastFlowPollAt && lastFlowPollAt > 0) continue;
      const vol = (t.size * t.price).toFixed(0);
      const side = t.side === 'BUY' ? 'BUY' : 'SELL';
      const sideColor = side === 'BUY' ? '#00ff00' : '#ff0044';
      const title = (t.title || '').slice(0, 70);
      const price = (t.price * 100).toFixed(1);
      const trader = t.name || t.pseudonym || 'anon';
      pushFlow(side, sideColor, side === 'BUY' ? '>>' : '<<',
        `$${vol} ${side} "${title}" @ ${price}¢ — ${trader}`,
        'polymarket/trades');
    }
    lastFlowPollAt = Date.now();
  } catch (err) {
    console.error('[flow-trades]', err.message);
  }
}

// 2. Gamma API — market movers, price changes, volume surges
async function pollGammaMovers() {
  try {
    const res = await fetch(`${GAMMA_API}/events?active=true&closed=false&limit=100`, {
      headers: { Accept: 'application/json' },
      signal: AbortSignal.timeout(15000)
    });
    if (!res.ok) return;
    const events = await res.json();
    const newSnapshot = new Map();

    for (const event of events) {
      if (!event.markets) continue;
      for (const m of event.markets) {
        if (m.closed || !m.active) continue;
        const q = m.question || event.title || '';
        const cid = m.conditionId;
        if (!cid) continue;

        let prices;
        try { prices = JSON.parse(m.outcomePrices || '[]'); } catch { prices = []; }
        const yesPrice = parseFloat(prices[0] || 0);
        const vol24h = parseFloat(event.volume24hr || 0);
        const change1h = m.oneHourPriceChange != null ? parseFloat(m.oneHourPriceChange) : null;
        const change1d = m.oneDayPriceChange != null ? parseFloat(m.oneDayPriceChange) : null;
        const liq = parseFloat(event.liquidity || 0);
        const spread = parseFloat(m.spread || 0);

        newSnapshot.set(cid, { price: yesPrice, vol24h, change1h, q, liq, spread });

        // Compare to previous snapshot
        const prev = prevGammaSnapshot.get(cid);
        if (!prev) continue;

        // Detect 1h movers
        if (change1h != null && Math.abs(change1h) >= 0.02 && vol24h > 5000) {
          const dir = change1h > 0 ? '+' : '';
          pushFlow('MOVER', change1h > 0 ? '#00ff00' : '#ff0044', '^v',
            `${dir}${(change1h * 100).toFixed(1)}% in 1h — "${q.slice(0, 65)}" now @ ${(yesPrice * 100).toFixed(1)}¢ (vol $${(vol24h / 1000).toFixed(0)}K)`,
            'gamma/events');
        }

        // Detect price jumps since last poll
        const priceDiff = yesPrice - prev.price;
        if (Math.abs(priceDiff) >= 0.02) {
          const dir = priceDiff > 0 ? '+' : '';
          pushFlow('SHIFT', '#00ddff', '/\\',
            `Price ${dir}${(priceDiff * 100).toFixed(1)}¢ — "${q.slice(0, 65)}" ${(prev.price * 100).toFixed(1)}¢ → ${(yesPrice * 100).toFixed(1)}¢`,
            'gamma/events');
        }

        // Detect wide spreads
        if (spread > 0.05 && liq > 30000) {
          const bid = parseFloat(m.bestBid || 0);
          const ask = parseFloat(m.bestAsk || 0);
          if (!prev.spread || Math.abs(spread - prev.spread) > 0.01) {
            pushFlow('SPREAD', '#ff6600', '<>',
              `${(spread * 100).toFixed(1)}¢ spread — "${q.slice(0, 60)}" bid ${(bid * 100).toFixed(1)}¢ / ask ${(ask * 100).toFixed(1)}¢ (liq $${(liq / 1000).toFixed(0)}K)`,
              'clob/book');
          }
        }
      }
    }

    // Detect new markets appearing
    if (prevGammaSnapshot.size > 0) {
      for (const [cid, snap] of newSnapshot) {
        if (!prevGammaSnapshot.has(cid) && snap.vol24h > 10000) {
          pushFlow('NEW', '#ff00ff', '++',
            `New market: "${snap.q.slice(0, 65)}" @ ${(snap.price * 100).toFixed(1)}¢ — vol $${(snap.vol24h / 1000).toFixed(0)}K`,
            'gamma/events');
        }
      }
    }

    prevGammaSnapshot = newSnapshot;
  } catch (err) {
    console.error('[flow-gamma]', err.message);
  }
}

// 3. CoinGecko — top crypto prices (same source as AI's crypto.mjs)
let lastCryptoPrices = {};
async function pollCoinGecko() {
  try {
    const coins = 'bitcoin,ethereum,solana,dogecoin,cardano,avalanche-2,chainlink,polkadot,near,sui';
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coins}&vs_currencies=usd&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) return;
    const data = await res.json();
    for (const [coin, d] of Object.entries(data)) {
      const prev = lastCryptoPrices[coin];
      const price = d.usd;
      const change = d.usd_24h_change || 0;
      const vol = d.usd_24h_vol || 0;
      const mcap = d.usd_market_cap || 0;
      const name = coin.replace(/-\d+$/, '').toUpperCase();
      // Only push if price changed meaningfully or first load
      if (!prev || Math.abs(price - prev) / prev > 0.002) {
        const dir = change >= 0 ? '+' : '';
        pushFlow('PRICE', change >= 0 ? '#00ff00' : '#ff0044', '$',
          `${name} $${price.toLocaleString(undefined, {maximumFractionDigits: 2})} (${dir}${change.toFixed(2)}% 24h) — vol $${(vol/1e9).toFixed(2)}B mcap $${(mcap/1e9).toFixed(1)}B`,
          'coingecko');
      }
      lastCryptoPrices[coin] = price;
    }
  } catch (err) { console.error('[flow-coingecko]', err.message); }
}

// 4. Fear & Greed Index — crypto sentiment (same source as AI's crypto.mjs)
let lastFearGreed = null;
async function pollFearGreed() {
  try {
    const res = await fetch('https://api.alternative.me/fng/?limit=1', { signal: AbortSignal.timeout(5000) });
    if (!res.ok) return;
    const data = await res.json();
    const fg = data?.data?.[0];
    if (!fg) return;
    const val = parseInt(fg.value);
    if (lastFearGreed === val) return;
    lastFearGreed = val;
    const cls = fg.value_classification || '';
    const barColor = val <= 25 ? '#ff0044' : val <= 45 ? '#ff6600' : val <= 55 ? '#ffaa00' : val <= 75 ? '#00cc00' : '#00ff00';
    pushFlow('SENTIMENT', barColor, '~',
      `Fear & Greed Index: ${val}/100 (${cls}) — ${val <= 25 ? 'Extreme Fear' : val <= 45 ? 'Fear' : val <= 55 ? 'Neutral' : val <= 75 ? 'Greed' : 'Extreme Greed'}`,
      'alternative.me/fng');
  } catch (err) { console.error('[flow-fng]', err.message); }
}

// 5. NWS Weather — forecasts for major cities (same source as AI's weather.mjs)
const NWS_CITIES = [
  { name: 'NYC', office: 'OKX', gridX: 33, gridY: 37 },
  { name: 'Chicago', office: 'LOT', gridX: 65, gridY: 76 },
  { name: 'LA', office: 'LOX', gridX: 154, gridY: 44 },
  { name: 'Miami', office: 'MFL', gridX: 75, gridY: 67 },
  { name: 'Denver', office: 'BOU', gridX: 62, gridY: 60 },
];
let nwsCityIdx = 0;
let lastNwsData = {};
async function pollNWS() {
  try {
    const city = NWS_CITIES[nwsCityIdx % NWS_CITIES.length];
    nwsCityIdx++;
    const res = await fetch(`https://api.weather.gov/gridpoints/${city.office}/${city.gridX},${city.gridY}/forecast`, {
      headers: { 'User-Agent': 'polymarket-alpha-dashboard' },
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) return;
    const data = await res.json();
    const periods = data?.properties?.periods;
    if (!Array.isArray(periods) || !periods.length) return;
    const today = periods[0];
    const key = city.name + today.number;
    if (lastNwsData[city.name] === key) return;
    lastNwsData[city.name] = key;
    pushFlow('WEATHER', '#00ddff', '**',
      `${city.name}: ${today.temperature}°${today.temperatureUnit} ${today.shortForecast} — Wind ${today.windSpeed} ${today.windDirection}`,
      'weather.gov/nws');
    // Tomorrow if available
    if (periods[1]) {
      pushFlow('WEATHER', '#0099cc', '**',
        `${city.name} tomorrow: ${periods[1].temperature}°${periods[1].temperatureUnit} ${periods[1].shortForecast}`,
        'weather.gov/nws');
    }
  } catch (err) { console.error('[flow-nws]', err.message); }
}

// 6. GDELT — global news volume trends (same source as AI's gdelt.mjs)
const GDELT_QUERIES = ['tariff trade war', 'federal reserve interest rate', 'trump executive order', 'bitcoin cryptocurrency', 'ukraine russia war', 'china taiwan'];
let gdeltIdx = 0;
async function pollGDELT() {
  try {
    const q = GDELT_QUERIES[gdeltIdx % GDELT_QUERIES.length];
    gdeltIdx++;
    const res = await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=${encodeURIComponent(q)}&mode=artlist&maxrecords=5&format=json&sort=datedesc`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) return;
    const data = await res.json();
    const articles = data?.articles;
    if (!Array.isArray(articles)) return;
    for (const a of articles.slice(0, 2)) {
      const title = (a.title || '').slice(0, 90);
      const domain = (a.domain || a.url || '').replace(/^www\./, '').split('/')[0];
      if (!title) continue;
      pushFlow('NEWS', '#ffaa00', 'N',
        `${title} — ${domain}`,
        'gdelt/news');
    }
  } catch (err) { console.error('[flow-gdelt]', err.message); }
}

// 7. Merge AI scanner logs into the data flow
function mergeScannserLogs() {
  // Find logs newer than our last seen
  const cutoff = dataFlowItems.length > 0 ? dataFlowItems[dataFlowItems.length - 1]?.ts : null;
  for (const e of cachedLogs) {
    if (e.type === 'pipeline') continue;
    // Avoid duplicates — check if we already have this exact entry
    const eKey = e.timestamp + '|' + (e.message || '').slice(0, 40);
    if (dataFlowItems.some(d => (d.ts + '|' + d.msg.slice(0, 40)) === eKey)) continue;

    const msg = e.message || '';
    const type = e.type || '';

    if (type === 'trade') {
      if (msg.startsWith('Bought ')) pushFlow('BOT BUY', '#00ff00', '$$', msg, 'auto-trade');
      else if (msg.startsWith('TAKE PROFIT')) pushFlow('TAKE PROFIT', '#00ff00', '$$', msg, 'auto-sell');
      else if (msg.startsWith('STOP LOSS')) pushFlow('STOP LOSS', '#ff0044', '$$', msg, 'auto-sell');
      else pushFlow('TRADE', '#ff00ff', '$$', msg, 'auto-trade');
    } else if (type === 'redeem') {
      pushFlow('REDEEM', '#00ff00', '$$', msg, 'auto-redeem');
    } else if (type === 'palpha') {
      if (msg.includes('[grok]')) pushFlow('GROK AI', '#ff6600', 'AI', msg, 'xai/grok');
      else if (msg.includes('[alt]')) pushFlow('ALT DATA', '#00ddff', '<>', msg, 'palpha/alt');
      else if (msg.includes('VETOED')) pushFlow('VETO', '#ff0044', 'XX', msg, 'palpha/gate');
      else if (msg.includes('Buying ')) pushFlow('SIGNAL', '#00ff00', '!!', msg, 'palpha/signal');
      else pushFlow('ALPHA', '#00ddff', '**', msg, 'palpha');
    } else if (type === 'think') {
      if (msg.includes('Live flow:')) pushFlow('FLOW', '#ffaa00', '~~', msg, 'data-api/trades');
      else if (msg.includes('mover:')) pushFlow('MOVER', '#00ff00', '^v', msg, 'gamma/events');
      else pushFlow('SIGNAL', '#00aaff', '**', msg, 'scanner');
    } else if (type === 'decision') {
      pushFlow('DECISION', '#ffaa00', '=>', msg, 'scanner');
    } else if (type === 'pnl') {
      pushFlow('P&L', '#00ff00', '$', msg, 'portfolio');
    } else if (type === 'scan') {
      pushFlow('SCAN', '#00ff00', '>>', msg, 'scanner');
    }
  }

  // Sort by timestamp desc
  dataFlowItems.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  if (dataFlowItems.length > DATA_FLOW_MAX) dataFlowItems.length = DATA_FLOW_MAX;
}

// ── PnL Calculation ──────────────────────────────────────
function getLivePrice(p) {
  // Prefer CLOB midpoint, fall back to Data API curPrice
  if (p.asset && liveMidpoints[p.asset] !== undefined) {
    return parseFloat(liveMidpoints[p.asset]);
  }
  return parseFloat(p.curPrice || 0);
}

function calcPositionPnl(p) {
  const size = parseFloat(p.size || 0);
  const avgPrice = parseFloat(p.avgPrice || 0);
  const livePrice = getLivePrice(p);
  const cost = size * avgPrice;
  const value = size * livePrice;
  const pnlDollar = value - cost;
  const pnlPct = cost > 0 ? (pnlDollar / cost) * 100 : 0;
  return { size, avgPrice, livePrice, cost, value, pnlDollar, pnlPct };
}

function isActivePosition(p) {
  const calc = calcPositionPnl(p);
  return calc.value >= 2 && calc.livePrice >= 0.01 && calc.livePrice < 0.99;
}

function calcTotalUnrealized() {
  return positions.filter(isActivePosition).reduce((sum, p) => sum + calcPositionPnl(p).pnlDollar, 0);
}

function calcTotalDeployed() {
  return positions.filter(isActivePosition).reduce((sum, p) => sum + calcPositionPnl(p).cost, 0);
}

function calcTotalRealized() {
  const sellPnl = activity
    .filter(a => a.type === 'SELL' || a.type === 'sell')
    .reduce((sum, a) => sum + parseFloat(a.cashPnl || a.pnl || 0), 0);
  // Include auto-redeem PnL from scanner logs (winning shares redeemed on-chain)
  const redeemPnl = cachedLogs
    .filter(a => a.type === 'redeem' && a.cashPnl)
    .reduce((sum, a) => sum + parseFloat(a.cashPnl), 0);
  return sellPnl + redeemPnl;
}

// ── Render: Logs ─────────────────────────────────────────
function renderLogs() {
  if (!cachedLogs.length) {
    content.innerHTML = '<div class="empty">Waiting for scan data...</div>';
    return;
  }
  const sorted = [...cachedLogs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  let html = '';
  for (const log of sorted.slice(0, 200)) {
    const cls = 'log-type-' + (log.type || 'scan');
    html += '<div class="log-entry ' + cls + '"><span class="log-timestamp">' + ts(log.timestamp) + '</span>' + esc(log.message || JSON.stringify(log)) + '</div>';
  }
  content.innerHTML = html;
}

// ── Render: Open Positions ───────────────────────────────
function renderPositions() {
  const visible = positions.filter(p => {
    const calc = calcPositionPnl(p);
    // Hide: dust (price < 1¢), resolved winners (price >= 99¢), low value (< $2)
    return calc.value >= 2 && calc.livePrice >= 0.01 && calc.livePrice < 0.99;
  });
  if (!visible.length) {
    content.innerHTML = '<div class="empty">No open positions (hiding ' + positions.length + ' dust positions worth &lt; $2)</div>';
    return;
  }

  let html = '';
  for (const p of visible) {
    const calc = calcPositionPnl(p);
    const cls = calc.pnlDollar > 0.001 ? 'profit' : calc.pnlDollar < -0.001 ? 'loss' : 'flat';
    const hours = p.timestamp ? ((Date.now() - new Date(p.timestamp).getTime()) / 3600000) : 0;

    // On-chain verification indicator
    let verifyIcon = '';
    if (p.asset && onChainBalances[p.asset] !== undefined) {
      const chainSize = onChainBalances[p.asset];
      const match = Math.abs(calc.size - chainSize) < 0.01;
      verifyIcon = match
        ? '<span class="source-tag source-onchain" title="On-chain verified">&#10003; On-Chain</span>'
        : '<span class="source-tag" style="background:#3a1a1a;color:#ff0044;border:1px solid #ff004433" title="Mismatch: chain=' + chainSize.toFixed(2) + '">&#10007; Mismatch</span>';
    }

    // Price source indicator
    const priceSource = (p.asset && liveMidpoints[p.asset] !== undefined)
      ? '<span class="source-tag source-clob">CLOB Live</span>'
      : '<span class="source-tag source-api">Data API</span>';

    html += '<div class="pos-card ' + cls + '">'
      + '<div>'
      + '<div class="pos-q">' + esc(p.title || '?') + verifyIcon + '</div>'
      + '<div class="pos-meta">'
      + '<div>' + esc(p.outcome || 'YES') + ' <span>@ ' + (calc.avgPrice * 100).toFixed(1) + '¢</span></div>'
      + '<div>Now <span>' + (calc.livePrice * 100).toFixed(1) + '¢</span>' + priceSource + '</div>'
      + '<div>Cost <span>' + fmt(calc.cost) + '</span></div>'
      + '<div>Shares <span>' + calc.size.toFixed(1) + '</span></div>'
      + (hours > 0 ? '<div>' + hours.toFixed(1) + 'h held</div>' : '')
      + '</div>'
      + '</div>'
      + '<div class="pos-pnl">'
      + '<div class="pos-pnl-val ' + pnlClass(calc.pnlDollar) + '">' + (calc.pnlDollar >= 0 ? '+' : '') + calc.pnlDollar.toFixed(3) + '</div>'
      + '<div class="pos-pnl-pct ' + pnlClass(calc.pnlPct) + '">' + (calc.pnlPct >= 0 ? '+' : '') + calc.pnlPct.toFixed(1) + '%</div>'
      + '</div>'
      + '</div>';
  }
  content.innerHTML = html;
}

// ── Render: Closed / Trade Activity ──────────────────────
function renderClosed() {
  if (!activity.length) {
    content.innerHTML = '<div class="empty">No trade activity</div>';
    return;
  }

  // Merge Data API activity + auto-redeem entries from scanner logs
  const redeemEntries = cachedLogs
    .filter(a => a.type === 'redeem' && a.cashPnl)
    .map(a => ({ ...a, type: 'REDEEM' }));
  const sorted = [...activity, ...redeemEntries].sort((a, b) => new Date(b.timestamp || b.createdAt) - new Date(a.timestamp || a.createdAt));

  const exits = sorted.filter(a => (a.type || '').toUpperCase() === 'SELL' || (a.type || '').toUpperCase() === 'REDEEM');
  const totalRealized = exits.reduce((s, a) => s + parseFloat(a.cashPnl || a.pnl || 0), 0);
  const wins = exits.filter(a => parseFloat(a.cashPnl || a.pnl || 0) > 0).length;
  const winRate = exits.length ? (wins / exits.length * 100).toFixed(0) : '--';

  let html = '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #333;display:flex;gap:24px;font-size:0.8rem">'
    + '<div><span style="color:#666">Trades:</span> <span style="color:#ccc">' + sorted.length + '</span></div>'
    + '<div><span style="color:#666">Exits:</span> <span style="color:#ccc">' + exits.length + '</span></div>'
    + '<div><span style="color:#666">Realized P&L:</span> <span class="' + pnlClass(totalRealized) + '">' + (totalRealized >= 0 ? '+' : '') + totalRealized.toFixed(3) + '</span></div>'
    + '<div><span style="color:#666">Win Rate:</span> <span style="color:#ccc">' + winRate + '%</span></div>'
    + '</div>';

  for (const a of sorted) {
    const typeUp = (a.type || '').toUpperCase();
    const isSell = typeUp === 'SELL';
    const isBuy = typeUp === 'BUY';
    const isRedeem = typeUp === 'REDEEM';
    const isExit = isSell || isRedeem;
    const pnl = parseFloat(a.cashPnl || a.pnl || 0);
    const price = parseFloat(a.price || a.avgPrice || 0);
    const size = parseFloat(a.size || a.usdcSize || 0);
    const time = a.timestamp || a.createdAt;
    const txHash = a.transactionHash || '';

    const typeColor = isExit ? (pnl >= 0 ? '#00ff00' : '#ff0044') : '#ffaa00';
    const typeLabel = isRedeem ? 'REDEEM' : isSell ? 'SELL' : isBuy ? 'BUY' : (a.type || '?');

    const txLink = txHash
      ? ' <a class="tx-link" href="https://polygonscan.com/tx/' + esc(txHash) + '" target="_blank" rel="noopener">' + txHash.slice(0, 10) + '...</a>'
      : '';

    html += '<div class="closed-card">'
      + '<span style="color:' + typeColor + ';font-weight:bold">' + typeLabel + '</span> '
      + esc((a.title || a.question || '').slice(0, 60))
      + ' | <span style="color:#ccc">' + esc(a.outcome || a.side || '') + '</span>'
      + ' @ ' + (price * 100).toFixed(1) + '¢'
      + ' | ' + fmt(size)
      + (isExit ? ' | P&L: <span class="' + pnlClass(pnl) + '">' + (pnl >= 0 ? '+' : '') + pnl.toFixed(3) + '</span>' : '')
      + (time ? ' | <span style="color:#555">' + ts(time) + '</span>' : '')
      + txLink
      + '</div>';
  }
  content.innerHTML = html;
}

function wbox(label, value, pnlVal, sourceClass, sourceLabel) {
  const cls = pnlVal !== undefined ? (pnlVal > 0.001 ? 'pnl-pos' : pnlVal < -0.001 ? 'pnl-neg' : 'pnl-neutral') : '';
  const tag = sourceClass ? '<span class="source-tag ' + sourceClass + '" style="font-size:0.5rem">' + (sourceLabel || '') + '</span>' : '';
  return '<div class="w-box"><div class="w-label">' + label + tag + '</div><div class="w-val ' + cls + '">' + value + '</div></div>';
}

// ── Render: Performance Graph ────────────────────────────
let perfHistory = []; // { time, netWorth, unrealized, deployed, balance }
const PERF_MAX_POINTS = 360; // ~1 hour at 10s intervals

function recordPerfSnapshot() {
  const deployed = calcTotalDeployed();
  const unrealized = calcTotalUnrealized();
  const balance = usdcBalance != null ? usdcBalance : 0;
  const netWorth = balance + deployed + unrealized;
  perfHistory.push({
    time: Date.now(),
    netWorth,
    unrealized,
    deployed,
    balance
  });
  if (perfHistory.length > PERF_MAX_POINTS) {
    perfHistory = perfHistory.slice(-PERF_MAX_POINTS);
  }
}

function renderPerf() {
  if (perfHistory.length < 2) {
    content.innerHTML = '<div class="empty">Collecting data points... (' + perfHistory.length + '/2 minimum)</div>';
    return;
  }

  const W = Math.min(content.clientWidth - 40, 1200);
  const H = Math.min(content.clientHeight - 120, 500);
  const PAD = { top: 30, right: 80, bottom: 40, left: 70 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;

  // Data ranges
  const values = perfHistory.map(p => p.netWorth);
  const minVal = Math.min(...values);
  const maxVal = Math.max(...values);
  const range = maxVal - minVal || 1;
  const padding = range * 0.1;
  const yMin = 0;
  const yMax = maxVal + padding;
  const yRange = yMax - yMin;

  const tMin = perfHistory[0].time;
  const tMax = perfHistory[perfHistory.length - 1].time;
  const tRange = tMax - tMin || 1;

  // Stats
  const first = perfHistory[0].netWorth;
  const last = perfHistory[perfHistory.length - 1].netWorth;
  const change = last - first;
  const changePct = first > 0 ? (change / first * 100) : 0;
  const peak = Math.max(...values);
  const trough = Math.min(...values);

  let html = '<div style="margin-bottom:10px;display:flex;gap:24px;font-size:0.8rem;flex-wrap:wrap">'
    + '<div><span style="color:#666">Net Worth:</span> <span style="color:#00ff00">' + fmt(last) + '</span></div>'
    + '<div><span style="color:#666">Session:</span> <span class="' + pnlClass(change) + '">' + (change >= 0 ? '+' : '') + change.toFixed(3) + ' (' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)</span></div>'
    + '<div><span style="color:#666">Peak:</span> <span style="color:#ccc">' + fmt(peak) + '</span></div>'
    + '<div><span style="color:#666">Trough:</span> <span style="color:#ccc">' + fmt(trough) + '</span></div>'
    + '<div><span style="color:#666">Points:</span> <span style="color:#ccc">' + perfHistory.length + '</span></div>'
    + '</div>';

  html += '<canvas id="perfCanvas" width="' + W + '" height="' + H + '" style="display:block;margin:0 auto"></canvas>';

  // Unrealized P&L sparkline stats
  const uValues = perfHistory.map(p => p.unrealized);
  const uLast = uValues[uValues.length - 1];

  html += '<div style="margin-top:12px;font-size:0.75rem;color:#555">'
    + '<span style="color:#666">Unrealized P&L:</span> <span class="' + pnlClass(uLast) + '">' + (uLast >= 0 ? '+' : '') + uLast.toFixed(3) + '</span>'
    + ' | <span style="color:#666">USDC:</span> <span style="color:#ccc">' + fmt(perfHistory[perfHistory.length - 1].balance) + '</span>'
    + ' | <span style="color:#666">Deployed:</span> <span style="color:#ccc">' + fmt(perfHistory[perfHistory.length - 1].deployed) + '</span>'
    + '</div>';

  content.innerHTML = html;

  // Draw on canvas
  const canvas = document.getElementById('perfCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Grid lines (terminal style — dotted green)
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  const gridRows = 5;
  for (let i = 0; i <= gridRows; i++) {
    const y = PAD.top + (plotH / gridRows) * i;
    ctx.beginPath();
    ctx.setLineDash([2, 4]);
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + plotW, y);
    ctx.stroke();

    // Y-axis labels
    const val = yMax - (yRange / gridRows) * i;
    ctx.fillStyle = '#555';
    ctx.font = '11px "SF Mono", Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.fillText('$' + val.toFixed(2), PAD.left - 8, y + 4);
  }

  // Time axis labels
  ctx.setLineDash([]);
  const gridCols = Math.min(6, perfHistory.length - 1);
  for (let i = 0; i <= gridCols; i++) {
    const x = PAD.left + (plotW / gridCols) * i;
    const t = tMin + (tRange / gridCols) * i;

    ctx.strokeStyle = '#1a1a1a';
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.moveTo(x, PAD.top);
    ctx.lineTo(x, PAD.top + plotH);
    ctx.stroke();

    ctx.fillStyle = '#555';
    ctx.font = '10px "SF Mono", Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ts(new Date(t)), x, PAD.top + plotH + 16);
  }

  // Plot border
  ctx.setLineDash([]);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(PAD.left, PAD.top, plotW, plotH);

  // Zero line (if visible)
  const zeroY = PAD.top + plotH - ((0 - yMin) / yRange) * plotH;
  // We don't plot zero for net worth, but we do plot the starting value
  const startY = PAD.top + plotH - ((first - yMin) / yRange) * plotH;
  ctx.strokeStyle = '#333';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(PAD.left, startY);
  ctx.lineTo(PAD.left + plotW, startY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Net worth line
  ctx.strokeStyle = change >= 0 ? '#00ff00' : '#ff0044';
  ctx.lineWidth = 2;
  ctx.shadowColor = change >= 0 ? '#00ff0044' : '#ff004444';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  for (let i = 0; i < perfHistory.length; i++) {
    const x = PAD.left + ((perfHistory[i].time - tMin) / tRange) * plotW;
    const y = PAD.top + plotH - ((perfHistory[i].netWorth - yMin) / yRange) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Fill area under the line
  const gradient = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + plotH);
  if (change >= 0) {
    gradient.addColorStop(0, 'rgba(0, 255, 0, 0.15)');
    gradient.addColorStop(1, 'rgba(0, 255, 0, 0.01)');
  } else {
    gradient.addColorStop(0, 'rgba(255, 0, 68, 0.15)');
    gradient.addColorStop(1, 'rgba(255, 0, 68, 0.01)');
  }
  ctx.fillStyle = gradient;
  ctx.beginPath();
  for (let i = 0; i < perfHistory.length; i++) {
    const x = PAD.left + ((perfHistory[i].time - tMin) / tRange) * plotW;
    const y = PAD.top + plotH - ((perfHistory[i].netWorth - yMin) / yRange) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  // Close the path down to the bottom
  const lastX = PAD.left + ((perfHistory[perfHistory.length - 1].time - tMin) / tRange) * plotW;
  ctx.lineTo(lastX, PAD.top + plotH);
  ctx.lineTo(PAD.left, PAD.top + plotH);
  ctx.closePath();
  ctx.fill();

  // Current value dot
  const curX = lastX;
  const curY = PAD.top + plotH - ((last - yMin) / yRange) * plotH;
  ctx.fillStyle = change >= 0 ? '#00ff00' : '#ff0044';
  ctx.beginPath();
  ctx.arc(curX, curY, 4, 0, Math.PI * 2);
  ctx.fill();

  // Current value label
  ctx.fillStyle = change >= 0 ? '#00ff00' : '#ff0044';
  ctx.font = 'bold 12px "SF Mono", Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(fmt(last), curX + 8, curY + 4);

  // Title
  ctx.fillStyle = '#666';
  ctx.font = '11px "SF Mono", Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('NET WORTH (session)', PAD.left, PAD.top - 10);
}

// ── Render: Data Flow (Unusual Whales style) ─────────────
function renderData() {
  // Merge scanner AI logs into the live flow
  mergeScannserLogs();

  if (!dataFlowItems.length) {
    content.innerHTML = '<div class="empty">Initializing data flow... pulling from Polymarket, Gamma, CLOB APIs</div>';
    return;
  }

  // ── Header: live pipeline stats from latest pipeline entry
  const latestPipeline = [...cachedLogs].reverse().find(e => e.type === 'pipeline');
  let html = '<div class="flow-header">';
  if (latestPipeline) {
    const ing = latestPipeline.ingestion || {};
    const sig = latestPipeline.signals || {};
    const enr = latestPipeline.enrichment || {};
    const exec = latestPipeline.execution || {};
    const totalSigs = Object.values(sig).reduce((s, v) => s + (v || 0), 0);
    html += '<div class="flow-stat"><div class="flow-stat-val">' + (ing.markets || 0) + '</div><div class="flow-stat-label">MARKETS</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val" style="color:#ffaa00">' + totalSigs + '</div><div class="flow-stat-label">SIGNALS</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val" style="color:#00ddff">' + (enr.rawOpportunities || 0) + '</div><div class="flow-stat-label">OPPS</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val" style="color:#ff0044">' + (enr.vetoed || 0) + '</div><div class="flow-stat-label">VETOED</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val" style="color:#00ff00">' + (exec.tradesExecuted || 0) + '</div><div class="flow-stat-label">TRADED</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val">' + (exec.openPositions || 0) + '</div><div class="flow-stat-label">POSITIONS</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val">$' + (exec.dailySpend || 0).toFixed(0) + '</div><div class="flow-stat-label">DAILY $</div></div>'
      + '<div class="flow-stat"><div class="flow-stat-val" style="color:#555">#' + (latestPipeline.cycle || '?') + '</div><div class="flow-stat-label">CYCLE</div></div>';
  } else {
    html += '<div class="flow-stat"><div class="flow-stat-val" style="color:#555">--</div><div class="flow-stat-label">AWAITING PIPELINE</div></div>';
  }
  html += '</div>';

  // ── Source legend
  html += '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;font-size:0.6rem">';
  const sources = [
    { label: 'coingecko', color: '#8DC63F' },
    { label: 'fear&greed', color: '#ff6600' },
    { label: 'weather.gov/nws', color: '#00ddff' },
    { label: 'gdelt/news', color: '#ffaa00' },
    { label: 'polymarket/trades', color: '#00ff00' },
    { label: 'gamma/events', color: '#ffaa00' },
    { label: 'xai/grok', color: '#ff6600' },
    { label: 'palpha', color: '#00ddff' },
    { label: 'auto-trade', color: '#ff00ff' },
  ];
  for (const s of sources) {
    html += '<span style="color:' + s.color + ';background:' + s.color + '11;padding:1px 5px;border:1px solid ' + s.color + '33;border-radius:2px">' + s.label + '</span>';
  }
  html += '</div>';

  // ── Stream entries
  html += '<div class="flow-stream">';
  const items = dataFlowItems.slice(0, 400);
  for (const d of items) {
    // Highlight inline data
    let rendered = esc(d.msg);
    rendered = rendered.replace(/\$[\d,]+\.?\d*/g, '<span class="flow-money">$&</span>');
    rendered = rendered.replace(/[+-]?\d+\.?\d*%/g, function(m) {
      return '<span class="' + (!m.startsWith('-') ? 'flow-pct-pos' : 'flow-pct-neg') + '">' + m + '</span>';
    });
    rendered = rendered.replace(/&quot;([^&]+)&quot;/g, '<span class="flow-market">"$1"</span>');
    // Also match regular "quoted" strings
    rendered = rendered.replace(/"([^"]{4,70})"/g, '<span class="flow-market">"$1"</span>');

    html += '<div class="flow-row" style="border-left:2px solid ' + d.color + '">'
      + '<span class="flow-time">' + ts(d.ts) + '</span>'
      + '<span class="flow-icon" style="color:' + d.color + '">' + d.icon + '</span>'
      + '<span class="flow-tag" style="background:' + d.color + '22;color:' + d.color + ';border:1px solid ' + d.color + '44">' + d.tag + '</span>'
      + '<span class="flow-msg">' + rendered + '</span>'
      + '<span class="flow-src">' + (d.source || '') + '</span>'
      + '</div>';
  }
  html += '</div>';

  content.innerHTML = html;
}

// ── Render dispatch ──────────────────────────────────────
function render() {
  if (currentTab === 'logs') renderLogs();
  else if (currentTab === 'positions') renderPositions();
  else if (currentTab === 'closed') renderClosed();
  else if (currentTab === 'wallet') renderWallet();
  else if (currentTab === 'perf') renderPerf();
  else if (currentTab === 'data') renderData();
}

// ── Header update ────────────────────────────────────────
function updateHeader() {
  const deployed = calcTotalDeployed();
  const unrealized = calcTotalUnrealized();
  const realized = calcTotalRealized();
  const balance = usdcBalance != null ? usdcBalance : 0;

  document.getElementById('hBal').textContent = fmt(balance);
  document.getElementById('hDep').textContent = fmt(deployed);

  const hPnl = document.getElementById('hPnl');
  hPnl.textContent = (unrealized >= 0 ? '+' : '') + unrealized.toFixed(3);
  hPnl.className = 'pnl-value ' + pnlClass(unrealized);

  const hReal = document.getElementById('hReal');
  hReal.textContent = (realized >= 0 ? '+' : '') + realized.toFixed(3);
  hReal.className = 'pnl-value ' + pnlClass(realized);

  document.getElementById('hPos').textContent = positions.filter(isActivePosition).length;

  const statusEl = document.getElementById('statusText');
  const dotEl = document.getElementById('dot');
  const verifiedEl = document.getElementById('verifiedAt');

  if (positions.length || cachedLogs.length) {
    statusEl.textContent = 'live';
    dotEl.style.background = '#00ff00';
  } else {
    statusEl.textContent = 'connecting';
    dotEl.style.background = '#ffaa00';
  }

  if (lastVerifiedAt) {
    verifiedEl.style.display = 'inline';
    verifiedEl.textContent = onChainVerified ? '✓ verified ' + ts(lastVerifiedAt) : '✗ mismatch ' + ts(lastVerifiedAt);
    verifiedEl.className = onChainVerified ? 'verified' : 'unverified';
  }
}

// ── Polling loops ────────────────────────────────────────
async function pollPositionsAndPrices() {
  await fetchPositions();
  await fetchLivePrices();
  recordPerfSnapshot();
  updateHeader();
  render();
}

async function pollOnChain() {
  await verifyOnChain();
  updateHeader();
  render();
}

async function pollActivity() {
  await fetchActivity();
  if (currentTab === 'closed' || currentTab === 'wallet') render();
}

async function pollLogs() {
  await fetchLogs();
  if (currentTab === 'logs' || currentTab === 'data') render();
  updateHeader();
}

async function pollDataFlow() {
  await Promise.all([pollLiveTrades(), pollGammaMovers()]);
  if (currentTab === 'data') render();
}
async function pollExternalSources() {
  await Promise.all([pollCoinGecko(), pollFearGreed(), pollNWS(), pollGDELT()]);
  if (currentTab === 'data') render();
}

// ── Tab switching ────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

// ── Boot ─────────────────────────────────────────────────
(async function boot() {
  // Initial fetch — all in parallel
  await Promise.all([
    fetchPositions(),
    fetchActivity(),
    fetchLogs(),
    verifyOnChain()
  ]);
  await fetchLivePrices(); // needs positions loaded first
  recordPerfSnapshot();
  updateHeader();
  render();

  // Initial data flow pull — all external sources in parallel
  await Promise.all([pollLiveTrades(), pollGammaMovers(), pollCoinGecko(), pollFearGreed(), pollNWS(), pollGDELT()]);

  // Staggered polling intervals
  setInterval(pollPositionsAndPrices, 10000);  // positions + prices every 10s
  setInterval(pollOnChain, 30000);             // on-chain verify every 30s
  setInterval(pollActivity, 30000);            // trade activity every 30s
  setInterval(pollLogs, 10000);                // scanner logs + palpha every 10s
  setInterval(pollDataFlow, 15000);            // live trades + gamma movers every 15s
  setInterval(pollExternalSources, 30000);     // coingecko, fear&greed, NWS, GDELT every 30s

  // Extra-fast price refresh
  setInterval(async () => {
    await fetchLivePrices();
    updateHeader();
    if (currentTab === 'positions' || currentTab === 'wallet') render();
  }, 5000);
})();
</script>
