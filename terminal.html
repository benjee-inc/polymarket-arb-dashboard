<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Polymarket Alpha Terminal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #0a0a0a; 
  color: #00ff00; 
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace; 
  padding: 0;
  height: 100vh;
  overflow: hidden;
}

.header {
  background: #111;
  padding: 10px 20px;
  border-bottom: 1px solid #00ff00;
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.terminal {
  padding: 20px;
  height: calc(100vh - 40px);
  overflow-y: auto;
  background: #0a0a0a;
}

.log-entry {
  margin-bottom: 8px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 0.85rem;
}

.log-timestamp {
  color: #666;
  font-size: 0.7rem;
  margin-right: 12px;
  user-select: none;
}

.log-type-scan { color: #00ff00; }
.log-type-think { color: #00aaff; }
.log-type-decision { color: #ffaa00; font-weight: bold; }
.log-type-trade { color: #ff00ff; }
.log-type-error { color: #ff0044; }

.cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: #00ff00;
  animation: blink 1s infinite;
  vertical-align: text-bottom;
  margin-left: 4px;
}

@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #00ff00; }
::-webkit-scrollbar-thumb:hover { background: #00aa00; }

.connection-status {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #00ff00;
  border-radius: 50%;
  margin-left: 8px;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.filter-controls {
  position: absolute;
  right: 20px;
  top: 40px;
  background: #111;
  padding: 10px;
  border: 1px solid #00ff00;
  border-radius: 4px;
  font-size: 0.7rem;
}

.filter-controls label {
  margin-left: 8px;
  cursor: pointer;
}
</style>
</head>
<body>
  <div class="header">
    <div>🤖 Polymarket Alpha Terminal v1.0</div>
    <div id="status">Connecting<span class="connection-status" id="connStatus"></span></div>
  </div>
  
  <div class="terminal" id="terminal">
    <div class="log-entry">
      <span class="log-timestamp">--:--:--</span>
      <span>🔄 Connecting to bot session logs...</span>
      <span class="cursor"></span>
    </div>
  </div>

<script>
const terminal = document.getElementById('terminal');
const status = document.getElementById('status');
const connStatus = document.getElementById('connStatus');
let lastTimestamp = '';

function formatTime(date) {
  const d = new Date(date);
  return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function addLog(timestamp, message, type = 'scan') {
  const entry = document.createElement('div');
  entry.className = "log-entry log-type-" + type;
  
  const timeSpan = document.createElement('span');
  timeSpan.className = 'log-timestamp';
  timeSpan.textContent = formatTime(timestamp);
  
  const msgSpan = document.createElement('span');
  msgSpan.textContent = message;
  
  entry.appendChild(timeSpan);
  entry.appendChild(msgSpan);
  
  terminal.insertBefore(entry, terminal.firstChild);
  
  while (terminal.children.length > 500) {
    terminal.removeChild(terminal.lastChild);
  }
}

async function fetchLogs() {
  try {
    const response = await fetch('./logs/terminal.jsonl?t=' + Date.now());
    if (!response.ok) {
      throw new Error('No logs yet');
    }
    
    const text = await response.text();
    const lines = text.trim().split('\n').filter(l => l);
    const logs = lines.slice(-50).map(line => {
      try {
        return JSON.parse(line);
      } catch { return null; }
    }).filter(Boolean);
    
    if (logs.length > 0) {
      status.textContent = 'Live Feed';
      connStatus.style.background = '#00ff00';
      
      terminal.innerHTML = '';
      logs.reverse().forEach(log => {
        addLog(log.timestamp, log.message, log.type || 'scan');
      });
    }
    
  } catch (err) {
    status.textContent = 'No Data';
    connStatus.style.background = '#ffaa00';
  }
}

// Auto-refresh logs
setInterval(fetchLogs, 5000);

// Load initial
fetchLogs();

// Display connection timestamp
addLog(Date.now(), '📡 Terminal connected successfully', 'scan');

setTimeout(() => {
  addLog(Date.now(), '📊 Dashboard and terminal are live', 'decision');
  addLog(Date.now(), '🌐 Proxy: Amsterdam (geoblock bypass active)', 'think');
}, 1000);

</script>
</body>
</html>
