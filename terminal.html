<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Polymarket Alpha Terminal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #0a0a0a; 
  color: #00ff00; 
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace; 
  padding: 0;
  height: 100vh;
  overflow: hidden;
}

.header {
  background: #111;
  padding: 10px 20px;
  border-bottom: 1px solid #00ff00;
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.tab-bar {
  background: #111;
  padding: 0 20px;
  border-bottom: 1px solid #00ff00;
  display: flex;
  font-size: 0.8rem;
}

.tab {
  padding: 8px 16px;
  cursor: pointer;
  border-right: 1px solid #00ff00;
  transition: background 0.2s;
}

.tab:hover { background: #222; }
.tab.active { background: #00ff00; color: #000; }

.terminal {
  padding: 20px;
  height: calc(100vh - 80px);
  overflow-y: auto;
  background: #0a0a0a;
}

.log-entry {
  margin-bottom: 8px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 0.85rem;
}

.log-timestamp {
  color: #666;
  font-size: 0.7rem;
  margin-right: 12px;
  user-select: none;
}

.position-card {
  background: #111;
  border: 1px solid #00ff00;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 4px;
}

.pos-question { font-weight: bold; color: #00ff00; margin-bottom: 8px; }
.pos-details { display: flex; flex-wrap: wrap; gap: 20px; font-size: 0.8rem; }
.pos-detail { color: #aaa; }
.pos-detail span { color: #00ff00; font-weight: bold; }
.pos-thesis { margin-top: 10px; font-size: 0.75rem; color: #888; }

.wallet-card {
  background: #111;
  border: 1px solid #00ff00;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 4px;
}

.wallet-header { font-size: 1.2rem; font-weight: bold; color: #00ff00; margin-bottom: 15px; }
.wallet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.wallet-item { text-align: center; }
.wallet-label { font-size: 0.75rem; color: #888; margin-bottom: 5px; }
.wallet-value { font-size: 1.5rem; font-weight: bold; color: #00ff00; }

.log-type-scan { color: #00ff00; }
.log-type-think { color: #00aaff; }
.log-type-decision { color: #ffaa00; font-weight: bold; }
.log-type-trade { color: #ff00ff; }
.log-type-error { color: #ff0044; }

.cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: #00ff00;
  animation: blink 1s infinite;
  vertical-align: text-bottom;
  margin-left: 4px;
}

@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #00ff00; }
::-webkit-scrollbar-thumb:hover { background: #00aa00; }

.connection-status {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #00ff00;
  border-radius: 50%;
  margin-left: 8px;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
  <div class="header">
    <div>🤖 Polymarket Alpha Terminal v2.0</div>
    <div id="status">Connecting<span class="connection-status" id="connStatus"></span></div>
  </div>
  
  <div class="tab-bar">
    <div class="tab active" data-tab="logs">📊 Logs</div>
    <div class="tab" data-tab="positions">📈 Positions (<span id="posCount">0</span>)</div>
    <div class="tab" data-tab="wallet">💰 Wallet</div>
  </div>
  
  <div class="terminal" id="terminal">
    <!-- Content will be populated by JavaScript -->
  </div>

<script>
const terminal = document.getElementById('terminal');
const status = document.getElementById('status');
const connStatus = document.getElementById('connStatus');
const posCount = document.getElementById('posCount');
let currentTab = 'logs';

function formatTime(date) {
  const d = new Date(date);
  return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatCurrency(value) {
  return '$' + parseFloat(value || 0).toFixed(2);
}

function showLogs(logs) {
  terminal.innerHTML = '';
  if (logs.length === 0) {
    terminal.innerHTML = '<div class="log-entry"><span>No logs yet</span></div>';
    return;
  }
  
  logs.reverse().forEach(log => {
    const entry = document.createElement('div');
    entry.className = "log-entry log-type-" + (log.type || 'scan');
    
    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-timestamp';
    timeSpan.textContent = formatTime(log.timestamp);
    
    const msgSpan = document.createElement('span');
    msgSpan.textContent = log.message || JSON.stringify(log);
    
    entry.appendChild(timeSpan);
    entry.appendChild(msgSpan);
    terminal.appendChild(entry);
  });
}

function showPositions(state) {
  terminal.innerHTML = '';
  
  if (!state || !state.activeBets || state.activeBets.length === 0) {
    terminal.innerHTML = '<div class="log-entry"><span>No open positions</span></div>';
    posCount.textContent = '0';
    return;
  }
  
  posCount.textContent = state.activeBets.length;
  
  state.activeBets.forEach(bet => {
    const card = document.createElement('div');
    card.className = 'position-card';
    
    const pnl = 0; // TODO: Calculate P&L from current price
    const pnlColor = pnl >= 0 ? '#00ff00' : '#ff0044';
    
    card.innerHTML = `
      <div class="pos-question">${bet.question}</div>
      <div class="pos-details">
        <div class="pos-detail">Side: <span>${bet.side.toUpperCase()}</span></div>
        <div class="pos-detail">Entry: <span>${(bet.price * 100).toFixed(1)}¢</span></div>
        <div class="pos-detail">Amount: <span>${formatCurrency(bet.amount)}</span></div>
        <div class="pos-detail">Strategy: <span>${bet.strategy}</span></div>
        <div class="pos-detail">P&L: <span style="color: ${pnlColor}">${formatCurrency(pnl)}</span></div>
      </div>
      <div class="pos-thesis">Thesis: ${bet.thesis}</div>
    `;
    
    terminal.appendChild(card);
  });
}

function showWallet(state) {
  terminal.innerHTML = '';
  
  const card = document.createElement('div');
  card.className = 'wallet-card';
  
  card.innerHTML = `
    <div class="wallet-header">Portfolio Overview</div>
    <div class="wallet-grid">
      <div class="wallet-item">
        <div class="wallet-label">Bankroll</div>
        <div class="wallet-value">${formatCurrency(state.bankroll || 0)}</div>
      </div>
      <div class="wallet-item">
        <div class="wallet-label">Deployed</div>
        <div class="wallet-value">${formatCurrency(state.activeBets ? state.activeBets.reduce((sum, bet) => sum + bet.amount, 0) : 0)}</div>
      </div>
      <div class="wallet-item">
        <div class="wallet-label">Total Trades</div>
        <div class="wallet-value">${state.totalTrades || 0}</div>
      </div>
      <div class="wallet-item">
        <div class="wallet-label">Open Positions</div>
        <div class="wallet-value">${state.activeBets ? state.activeBets.length : 0}</div>
      </div>
    </div>
  `;
  
  terminal.appendChild(card);
}

async function fetchData() {
  try {
    // Fetch logs
    const logsResponse = await fetch('./logs/terminal.jsonl?t=' + Date.now());
    let logs = [];
    if (logsResponse.ok) {
      const text = await logsResponse.text();
      const lines = text.trim().split('\n').filter(l => l);
      logs = lines.map(line => {
        try {
          return JSON.parse(line);
        } catch { return null; }
      }).filter(Boolean);
    }
    
    // Fetch state
    const stateResponse = await fetch('./state.json?t=' + Date.now());
    let state = null;
    if (stateResponse.ok) {
      state = await stateResponse.json();
    }
    
    // Update UI based on current tab
    if (currentTab === 'logs') {
      showLogs(logs);
    } else if (currentTab === 'positions') {
      showPositions(state);
    } else if (currentTab === 'wallet') {
      showWallet(state);
    }
    
    // Update status
    if (logs.length > 0) {
      status.textContent = 'Live Feed';
      connStatus.style.background = '#00ff00';
    }
    
  } catch (err) {
    status.textContent = 'No Data';
    connStatus.style.background = '#ffaa00';
  }
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    fetchData();
  });
});

// Auto-refresh
setInterval(fetchData, 5000);

// Initial load
fetchData();

</script>
</body>
</html>
